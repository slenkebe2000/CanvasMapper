<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Business Hours Map</title>

<style>
* { box-sizing: border-box; }
html, body { width:100%; height:100%; margin:0; padding:0; font-family:Arial,Helvetica,sans-serif; }
body { display:flex; flex-direction:column; overflow:hidden; }
#controls { flex:0 0 auto; padding:12px 16px; background:#fff; border-bottom:1px solid #ccc; box-shadow:0 1px 5px rgba(0,0,0,.15); position:relative; z-index:1000; }
.row { display:flex; align-items:center; gap:18px; flex-wrap:wrap; }
.control { min-width:220px; }
label { display:block; margin-bottom:5px; font-size:12px; font-weight:bold; color:#555; }
select { width:180px; padding:7px 9px; border:1px solid #aaa; border-radius:5px; background:#fff; font-size:14px; }
input[type="range"] { width:300px; }
input[type="file"] { max-width:260px; font-size:13px; }
#timeValue { display:inline-block; min-width:75px; font-weight:bold; }
#count { margin-left:auto; font-weight:bold; white-space:nowrap; }
.legend { margin-top:8px; color:#555; font-size:12px; }
#fileStatus { margin-left:8px; }
#map { flex:1 1 auto; width:100%; min-height:0; background:#e5e5e5; }
.leaflet-popup-content { max-height:450px; overflow-y:auto; min-width:280px; }
.popup-title { margin-bottom:8px; font-size:18px; font-weight:bold; }
.popup-status { margin-bottom:10px; font-weight:bold; }
.open { color:#16803c; }
.closed { color:#b42318; }
.hours { margin:8px 0; }
.hours div { padding:2px 0; line-height:1.3; }
.popup-table { width:100%; border-collapse:collapse; font-size:12px; }
.popup-table td { padding:4px 5px; border-top:1px solid #eee; vertical-align:top; }
.popup-table td:first-child { width:35%; font-weight:bold; white-space:nowrap; }
#mapError { display:none; position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); max-width:500px; padding:20px; background:#fff; border:1px solid #ccc; border-radius:8px; box-shadow:0 3px 15px rgba(0,0,0,.25); z-index:5000; }
#mapErrorTitle { font-weight:bold; margin-bottom:8px; }
</style>
</head>
<body>
<div id="controls">

      </select>
    </div>
    <div class="control">
      <label for="time">TIME: <span id="timeValue">12:00 PM</span></label>
      <input id="time" type="range" min="0" max="1439" value="720" step="15">
    </div>
    <div class="control">
      <label for="csvFile">LOAD ANOTHER CSV</label>
      <input id="csvFile" type="file" accept=".csv,text/csv">
    </div>
    <div id="count">0 businesses shown</div>
  </div>

</div>
<div id="map"></div>

0:00 AM – 9:00 PM", "thu_hours": "Thursday: 10:00 AM – 9:00 PM", "fri_hours": "Friday: 10:00 AM – 9:00 PM", "sat_hours": "Saturday: 10:00 AM – 9:00 PM", "sun_hours": "Sunday: 10:00 AM – 8:00 PM"}, {"": "306", "name": "Viridian Ink VT", "place_id": "ChIJs8QsJIt5ykwRbiFEvwL8YA0", "lat": "44.4511599", "lng": "-73.1104883", "status": "OPERATIONAL", "mon_hours": "Monday: Closed", "tue_hours": "Tuesday: Closed", "wed_hours": "Wednesday: 12:00 – 7:00 PM", "thu_hours": "Thursday: 12:00 – 7:00 PM", "fri_hours": "Friday: 12:00 – 7:00 PM", "sat_hours": "Saturday: 12:00 – 7:00 PM", "sun_hours": "Sunday: 12:00 – 7:00 PM"}, {"": "307", "name": "Judi’s Ice Cream", "place_id": "ChIJMbXIrIR5ykwRBWnaGx1olUs", "lat": "44.4545292", "lng": "-73.1118535", "status": "OPERATIONAL", "mon_hours": "Monday: 2:00 – 10:00 PM", "tue_hours": "Tuesday: 2:00 – 10:00 PM", "wed_hours": "Wednesday: 2:00 – 10:00 PM", "thu_hours": "Thursday: 2:00 – 10:00 PM", "fri_hours": "Friday: 2:00 – 10:00 PM", "sat_hours": "Saturday: 2:00 – 10:00 PM", "sun_hours": "Sunday: 2:00 – 10:00 PM"}];
const dayNames = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const dayColumns = ["mon_hours","tue_hours","wed_hours","thu_hours","fri_hours","sat_hours","sun_hours"];
let businesses = initialData;
let map = null;
let markers = [];

function cleanText(value) {
  return String(value ?? "").replace(/\u202f/g," ").replace(/\u2009/g," ").replace(/\u00a0/g," ");
}

function parseMinutes(value) {
  value = cleanText(value).trim().toUpperCase();
  const match = value.match(/^(\d{1,2}):(\d{2})\s*(AM|PM)$/);
  if (!match) return null;
  let hour = Number(match[1]);
  const minute = Number(match[2]);
  if (hour === 12) hour = 0;
  if (match[3] === "PM") hour += 12;
  return hour * 60 + minute;
}

function parseIntervals(dayText) {
  let text = cleanText(dayText).trim();
  if (!text) return [];
  text = text.replace(/^[A-Za-z]+:\s*/,"");
  if (/closed/i.test(text)) return [];
  if (/24\s*hours/i.test(text)) return [[0,1440]];
  const intervals = [];
  for (const part of text.split(",")) {
    const range = part.trim().match(/^(.+?)\s*[–-]\s*(.+)$/);
    if (!range) continue;
    let start = range[1].trim();
    const end = range[2].trim();
    const meridiem = end.match(/(AM|PM)/i);
    if (!/(AM|PM)/i.test(start) && meridiem) start += " " + meridiem[1];
    const startMinutes = parseMinutes(start);
    const endMinutes = parseMinutes(end);
    if (startMinutes === null || endMinutes === null) continue;
    let adjustedEnd = endMinutes;
    if (adjustedEnd <= startMinutes) adjustedEnd += 1440;
    intervals.push([startMinutes, adjustedEnd]);
  }
  return intervals;
}

function isOpenAt(business, dayIndex, minute) {
  const intervals = parseIntervals(business[dayColumns[dayIndex]] || "");
  return intervals.some(([start,end]) => end <= 1440 ? (minute >= start && minute <= end) : (minute >= start || minute <= end - 1440));
}

function formatTime(minutes) {
  const hour24 = Math.floor(minutes / 60);
  const minute = minutes % 60;
  const suffix = hour24 >= 12 ? "PM" : "AM";
  let hour12 = hour24 % 12;
  if (hour12 === 0) hour12 = 12;
  return hour12 + ":" + String(minute).padStart(2,"0") + " " + suffix;
}

function escapeHtml(value) {
  return String(value ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}

function createPopup(business, dayIndex, minute) {
  const open = isOpenAt(business,dayIndex,minute);
  const title = business.name || "Unnamed business";
  let hoursHtml = "";
  dayColumns.forEach((column,index) => {
    const value = cleanText(business[column] || "");
    hoursHtml += `<div><b>${dayNames[index]}:</b> ${escapeHtml(value || "No hours listed")}</div>`;
  });
  let rowsHtml = "";
  Object.keys(business).forEach(key => {
    if (key === "name" || key === "lat" || key === "lng") return;
    rowsHtml += `<tr><td>${escapeHtml(key)}</td><td>${escapeHtml(cleanText(business[key]))}</td></tr>`;
  });
  return `<div class="popup-title">${escapeHtml(title)}</div><div class="popup-status ${open ? "open" : "closed"}">${open ? "OPEN" : "CLOSED"} at ${escapeHtml(dayNames[dayIndex])} ${escapeHtml(formatTime(minute))}</div><strong>Weekly Hours</strong><div class="hours">${hoursHtml}</div><hr><strong>Business Information</strong><table class="popup-table">${rowsHtml}</table>`;
}

function clearMarkers() {
  markers.forEach(marker => map.removeLayer(marker));
  markers = [];
}

function renderMarkers() {
  if (!map) return;
  clearMarkers();
  const dayIndex = Number(document.getElementById("day").value);
  const minute = Number(document.getElementById("time").value);
  let shown = 0;
  businesses.forEach(business => {
    const lat = Number(business.lat);
    const lng = Number(business.lng);
    if (!Number.isFinite(lat) || !Number.isFinite(lng)) return;
    if (!isOpenAt(business,dayIndex,minute)) return;
    const marker = L.marker([lat,lng]).addTo(map).bindPopup(createPopup(business,dayIndex,minute));
    markers.push(marker);
    shown++;
  });
  document.getElementById("count").textContent = `${shown} of ${businesses.length} businesses shown`;
}

function fitMapToData() {
  if (!map) return;
  const points = businesses.map(business => [Number(business.lat),Number(business.lng)]).filter(point => Number.isFinite(point[0]) && Number.isFinite(point[1]));
  if (!points.length) return;
  if (points.length === 1) { map.setView(points[0],15); return; }
  map.fitBounds(points,{padding:[30,30]});
}

function parseCSV(text) {
  const rows = [];
  let row = [], cell = "", quoted = false;
  for (let i=0;i<text.length;i++) {
    const c = text[i], next = text[i+1];
    if (quoted) {
      if (c === '"' && next === '"') { cell += '"'; i++; }
      else if (c === '"') quoted = false;
      else cell += c;
    } else {
      if (c === '"') quoted = true;
      else if (c === ',') { row.push(cell); cell = ""; }
      else if (c === '\n') { row.push(cell); rows.push(row); row=[]; cell=""; }
      else if (c !== '\r') cell += c;
    }
  }
  row.push(cell);
  if (row.length > 1 || row[0] !== "") rows.push(row);
  if (!rows.length) return [];
  const headers = rows[0].map(v => v.trim());
  return rows.slice(1).filter(r => r.some(v => v.trim() !== "")).map(r => {
    const obj = {};
    headers.forEach((header,index) => obj[header] = r[index] ?? "");
    return obj;
  });
}

function loadCSVFile(file) {
  const reader = new FileReader();
  reader.onload = event => {
    try {
      const loaded = parseCSV(event.target.result);
      if (!loaded.length) throw new Error("The selected CSV contains no data rows.");
      businesses = loaded;
      document.getElementById("fileStatus").textContent = `Loaded ${businesses.length} rows from ${file.name}.`;
      fitMapToData();
      renderMarkers();
    } catch (error) {
      alert("Could not read CSV:\n\n" + error.message);
    }
  };
  reader.readAsText(file);
}

function initializeMap() {
  if (typeof L === "undefined") {
    document.getElementById("mapError").style.display = "block";
    document.getElementById("mapErrorText").textContent = "Leaflet could not be loaded. This map requires an internet connection to download Leaflet and OpenStreetMap tiles.";
    return;
  }
  try {
    map = L.map("map",{zoomControl:true});
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"&copy; OpenStreetMap contributors"}).addTo(map);
    fitMapToData();
    renderMarkers();
    setTimeout(() => map.invalidateSize(),100);
  } catch (error) {
    document.getElementById("mapError").style.display = "block";
    document.getElementById("mapErrorText").textContent = error.message;
  }
}

document.getElementById("day").addEventListener("change",renderMarkers);
document.getElementById("time").addEventListener("input",event => {
  document.getElementById("timeValue").textContent = formatTime(Number(event.target.value));
  renderMarkers();
});
document.getElementById("csvFile").addEventListener("change",event => {
  if (event.target.files[0]) loadCSVFile(event.target.files[0]);
});

document.getElementById("timeValue").textContent = formatTime(720);
initializeMap();
</script>
